<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magazzino Bar</title>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Librerie jsPDF per esportazione in PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background: #0f172a; color: #f8fafc; }
    h1 { font-size: 22px; text-align: center; color: #38bdf8; margin-bottom: 20px; }
    .card { background: #1e293b; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); margin-bottom: 15px; border: 1px solid #334155; }
    h3 { margin-top: 0; color: #38bdf8; font-size: 18px; }
    input, select, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; box-sizing: border-box; font-size: 16px; }
    input:focus { border-color: #38bdf8; outline: none; }
    button, label.file-btn { display: block; width: 100%; padding: 14px; margin: 6px 0; border-radius: 8px; border: none; background: #2563eb; color: white; font-weight: bold; text-align: center; cursor: pointer; box-sizing: border-box; transition: background 0.2s; font-size: 16px; }
    button:hover, label.file-btn:hover { background: #1d4ed8; }
    label.file-btn { background: #059669; }
    label.file-btn:hover { background: #047857; }
    button.export { background: #475569; }
    button.export:hover { background: #334155; }
    input[type="file"] { display: none; }
    .item { border-bottom: 1px solid #334155; padding: 12px 0; }
    .item:last-child { border-bottom: none; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; background: #334155; margin-right: 6px; margin-top: 4px; color: #e2e8f0; }
    .low { background: #7f1d1d; color: #fca5a5; font-weight: bold; }
    .sync-status { font-size: 12px; text-align: center; margin-bottom: 10px; color: #38bdf8; font-weight: bold; }
  </style>
</head>
<body>

<h1>📦 Gestione Magazzino Bar</h1>
<div id="syncStatus" class="sync-status">Stato: Connessione a Supabase...</div>

<div class="card">
  <!-- Scanner nativo ad alta velocità -->
  <label class="file-btn">
    📷 Scansiona Codice a Barre
    <input type="file" accept="image/*" capture="environment" id="cameraInput" onchange="scansionaCodiceNativo(event)">
  </label>
  
  <input type="text" id="barcode" placeholder="Codice a barre (o scrivi manuale)">
  <input type="text" id="nome" placeholder="Nome prodotto (es. Gin Tanqueray 1L)">
  <input type="number" id="mag1" placeholder="Quantità Magazzino 1 (Centrale)">
  <input type="number" id="mag2" placeholder="Quantità Magazzino 2 (Retro-banco)">
  <input type="number" id="minima" placeholder="Scorta minima totale per riordino">
  <button onclick="salvaProdotto()">💾 Salva / Aggiorna Prodotto</button>
</div>

<div class="card">
  <h3>Inventario e Report</h3>
  <div id="lista">Caricamento in corso...</div>
  
  <button class="export" style="background: #0284c7; margin-top: 12px;" onclick="esportaInventarioPDF()">📄 Scarica Inventario Completo (PDF)</button>
  <button class="export" style="background: #dc2626; margin-top: 8px;" onclick="esportaOrdinePDF()">📋 Scarica Lista Ordini Sotto Scorta (PDF)</button>
  <button class="export" style="background: #475569; margin-top: 8px;" onclick="esportaInventarioCSV()">📥 Scarica Backup (CSV)</button>
</div>

<script>
  const SUPABASE_URL = 'https://yzqhvfsakhvejdlbntqj.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6cWh2ZnNha2h2ZWpkbGJudHFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MzU2ODgsImV4cCI6MjExMDQxMTY4OH0.nbGUqjKygHyov2TZ1jLIUKgLHRZfjxI2-TLbjQ1rW4Q';
  
  let supabaseClient = null;
  let prodotti = {};

  try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } catch (e) {
    console.error("Errore init Supabase:", e);
  }

  async function caricaDati() {
    if (!supabaseClient) {
      document.getElementById('syncStatus').innerText = 'Stato: Errore libreria Supabase';
      return;
    }

    try {
      const { data, error } = await supabaseClient.from('magazzino_bar').select('*');
      if (error) throw error;

      prodotti = {};
      if (data) {
        data.forEach(row => {
          if (row.barcode) {
            prodotti[row.barcode] = {
              nome: row.nome,
              mag1: row.mag1,
              mag2: row.mag2,
              minima: row.minima
            };
          }
        });
      }
      document.getElementById('syncStatus').innerText = 'Stato: Cloud Sincronizzato (Supabase Attivo)';
    } catch (err) {
      console.error("Errore caricamento Supabase:", err.message);
      document.getElementById('syncStatus').innerText = 'Stato: Modalità Offline / Errore Supabase';
      prodotti = JSON.parse(localStorage.getItem('bar_db')) || {};
    }
    aggiornaLista();
  }

  async function salvaSuStorage(code, p) {
    prodotti[code] = p;
    localStorage.setItem('bar_db', JSON.stringify(prodotti));
    aggiornaLista();

    if (supabaseClient) {
      try {
        const { error } = await supabaseClient
          .from('magazzino_bar')
          .upsert({ 
            barcode: code, 
            nome: p.nome, 
            mag1: p.mag1, 
            mag2: p.mag2, 
            minima: p.minima 
          }, { onConflict: 'barcode' });

        if (error) {
          console.error("Errore salvataggio Supabase:", error);
          alert("Salvato in locale, ma errore su Supabase: " + error.message);
        } else {
          document.getElementById('syncStatus').innerText = 'Stato: Cloud Sincronizzato (Supabase Attivo)';
        }
      } catch (err) {
        console.error("Eccezione Supabase:", err);
        alert("Errore di rete verso Supabase: " + err.message);
      }
    }
  }

  async function scansionaCodiceNativo(event) {
    const file = event.target.files[0];
    if (!file) return;

    if (!('BarcodeDetector' in window)) {
      alert("Il tuo browser non supporta il lettore nativo. Aggiorna Chrome o Safari all'ultima versione.");
      return;
    }

    try {
      document.getElementById('syncStatus').innerText = 'Stato: Riconoscimento codice in corso...';
      
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      await img.decode();

      const detector = new BarcodeDetector({ 
        formats: ['ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'upc_e', 'qr_code'] 
      });
      
      const barcodes = await detector.detect(img);
      
      if (barcodes.length > 0) {
        const codiceTrovato = barcodes[0].rawValue;
        document.getElementById('barcode').value = codiceTrovato;
        
        if (prodotti[codiceTrovato]) {
          document.getElementById('nome').value = prodotti[codiceTrovato].nome;
          document.getElementById('mag1').value = prodotti[codiceTrovato].mag1;
          document.getElementById('mag2').value = prodotti[codiceTrovato].mag2;
          document.getElementById('minima').value = prodotti[codiceTrovato].minima;
        } else {
          document.getElementById('nome').value = '';
          document.getElementById('mag1').value = '';
          document.getElementById('mag2').value = '';
          document.getElementById('minima').value = '';
        }
        document.getElementById('syncStatus').innerText = 'Stato: Cloud Sincronizzato (Supabase Attivo)';
      } else {
        alert("Nessun codice a barre rilevato. Assicurati che l'etichetta sia ben illuminata e riprova.");
        document.getElementById('syncStatus').innerText = 'Stato: Cloud Sincronizzato (Supabase Attivo)';
      }
    } catch (err) {
      console.error("Errore BarcodeDetector:", err);
      alert("Errore durante la lettura dell'immagine.");
      document.getElementById('syncStatus').innerText = 'Stato: Cloud Sincronizzato (Supabase Attivo)';
    } finally {
      event.target.value = '';
    }
  }

  function salvaProdotto() {
    const code = document.getElementById('barcode').value.trim();
    const nome = document.getElementById('nome').value.trim();
    const mag1 = parseInt(document.getElementById('mag1').value) || 0;
    const mag2 = parseInt(document.getElementById('mag2').value) || 0;
    const minima = parseInt(document.getElementById('minima').value) || 0;

    if (!code || !nome) { alert("Inserisci almeno codice e nome prodotto!"); return; }

    salvaSuStorage(code, { nome, mag1, mag2, minima });
    
    document.getElementById('barcode').value = '';
    document.getElementById('nome').value = '';
    document.getElementById('mag1').value = '';
    document.getElementById('mag2').value = '';
    document.getElementById('minima').value = '';
  }

  function aggiornaLista() {
    const lista = document.getElementById('lista');
    lista.innerHTML = '';
    const keys = Object.keys(prodotti);
    if (keys.length === 0) {
      lista.innerHTML = '<div style="color: #94a3b8; text-align: center; padding: 10px;">Nessun prodotto in magazzino.</div>';
      return;
    }
    for (let code in prodotti) {
      const p = prodotti[code];
      const tot = p.mag1 + p.mag2;
      lista.innerHTML += `
        <div class="item">
          <strong>${p.nome}</strong> <small style="color: #94a3b8;">(${code})</small><br>
          <span class="badge">Mag 1: ${p.mag1}</span>
          <span class="badge">Mag 2: ${p.mag2}</span>
          <span class="badge ${tot <= p.minima ? 'low' : ''}">Tot: ${tot} / Min: ${p.minima}</span>
        </div>`;
    }
  }

  // 1. Esportazione Inventario Completo in PDF
  function esportaInventarioPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(18);
    doc.setTextColor(30, 41, 59);
    doc.text("Inventario Completo - Magazzino Bar", 14, 20);

    doc.setFontSize(10);
    doc.setTextColor(100, 116, 139);
    doc.text("Data generazione: " + new Date().toLocaleString(), 14, 28);

    const headers = [["Codice Barre", "Nome Prodotto", "Mag 1", "Mag 2", "Totale", "Scorta Min"]];
    const data = [];

    for (let code in prodotti) {
      const p = prodotti[code];
      const tot = p.mag1 + p.mag2;
      data.push([code, p.nome, p.mag1, p.mag2, tot, p.minima]);
    }

    if (data.length === 0) {
      alert("Nessun prodotto presente in magazzino!");
      return;
    }

    doc.autoTable({
      startY: 35,
      head: headers,
      body: data,
      theme: 'grid',
      headStyles: { fillColor: [37, 99, 235] },
      styles: { fontSize: 10, cellPadding: 4 }
    });

    doc.save("inventario_magazzino_bar.pdf");
  }

  // 2. Esportazione Lista Ordini Sotto Scorta in PDF
  function esportaOrdinePDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(18);
    doc.setTextColor(220, 38, 38);
    doc.text("Lista Ordini Sotto Scorta", 14, 20);

    doc.setFontSize(10);
    doc.setTextColor(100, 116, 139);
    doc.text("Data generazione: " + new Date().toLocaleString(), 14, 28);

    const headers = [["Codice Barre", "Nome Prodotto", "Mag 1", "Mag 2", "Totale", "Scorta Min"]];
    const data = [];
    let count = 0;

    for (let code in prodotti) {
      const p = prodotti[code];
      const tot = p.mag1 + p.mag2;
      if (tot <= p.minima) {
        data.push([code, p.nome, p.mag1, p.mag2, tot, p.minima]);
        count++;
      }
    }

    if (count === 0) {
      alert("Ottimo! Nessun prodotto è attualmente sotto scorta.");
      return;
    }

    doc.autoTable({
      startY: 35,
      head: headers,
      body: data,
      theme: 'grid',
      headStyles: { fillColor: [220, 38, 38] },
      styles: { fontSize: 10, cellPadding: 4 }
    });

    doc.save("ordini_sotto_scorta.pdf");
  }

  function esportaInventarioCSV() {
    let csvContent = "data:text/csv;charset=utf-8,Codice Barre;Nome Prodotto;Magazzino 1;Magazzino 2;Totale;Scorta Minima\n";
    for (let code in prodotti) {
      const p = prodotti[code];
      const tot = p.mag1 + p.mag2;
      csvContent += `"${code}","${p.nome}",${p.mag1},${p.mag2},${tot},${p.minima}\n`;
    }
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "inventario_magazzino_bar.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  caricaDati();
</script>
</body>
</html>
